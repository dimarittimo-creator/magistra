<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Sconti e prezzi farmacia – Sagè Pharma</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&family=Tinos&display=swap" rel="stylesheet"><style id="css">:root{--bg:#f6f7f7;--surface:#ffffff;--ink:#1d2427;--muted:#5a6a70;--line:#dfe4e6;--brand:#d4200a;--brand-strong:#b81b08;--brand-soft:#fde6e2;--slate:#4e676e;--slate-soft:#e7eef0;--amber:#9a6200;--amber-soft:#fbf0dc;--grey-soft:#eceff0;--focus:#2f6fb0;--b1:#6b8289;--b2:#e0913a;--b3:#ff2207;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15191b;--surface:#1d2326;--ink:#e8ecee;--muted:#9eabb0;--line:#2e373b;--brand:#ff5a42;--brand-strong:#ff6e58;--brand-soft:#3d1f1a;--slate:#9fb6bd;--slate-soft:#243034;--amber:#e4b25a;--amber-soft:#3a2f1a;--grey-soft:#262e31;--focus:#7fb2e6;--b1:#8fa6ad;--b2:#e9a65a;--b3:#ff5a42}}
:root[data-theme="dark"]{--bg:#15191b;--surface:#1d2326;--ink:#e8ecee;--muted:#9eabb0;--line:#2e373b;--brand:#ff5a42;--brand-strong:#ff6e58;--brand-soft:#3d1f1a;--slate:#9fb6bd;--slate-soft:#243034;--amber:#e4b25a;--amber-soft:#3a2f1a;--grey-soft:#262e31;--focus:#7fb2e6;--b1:#8fa6ad;--b2:#e9a65a;--b3:#ff5a42}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding:28px 20px 60px}
h1{font-family:"Tinos","Times New Roman",Times,serif;font-size:2rem;line-height:1.15;margin:0 0 6px;font-weight:400;color:var(--ink)}
h2{font-family:"Tinos","Times New Roman",Times,serif;font-size:1.3rem;margin:0 0 12px;font-weight:400}
.sub{color:var(--muted);margin:0 0 24px;max-width:70ch}
.grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px;margin-bottom:20px}
@media (max-width:820px){.grid{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 20px}
.bands{display:flex;flex-direction:column;gap:8px}
.band{display:grid;grid-template-columns:14px 1fr auto auto 32px;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;background:var(--bg)}
.sw{width:14px;height:14px;border-radius:4px}
.band label{font-size:.9rem;color:var(--muted)}
input{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:5px 8px;width:72px;text-align:right}
input:focus-visible,button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
input.over{border-color:var(--slate);background:var(--slate-soft)}
.unit{color:var(--muted);font-size:.9rem;margin-left:4px}
button{font:inherit;cursor:pointer;border-radius:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 14px}
button.primary{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
button.primary:hover:not(:disabled){background:var(--brand-strong)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) button.primary{color:#1a0c09}}
:root[data-theme="dark"] button.primary{color:#1a0c09}
button:disabled{opacity:.45;cursor:default}
button.x{border:none;background:none;color:var(--muted);padding:2px 6px;font-size:1.1rem}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.err{color:var(--brand);font-size:.9rem;margin-top:8px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{padding:10px 12px;border-radius:8px;background:var(--bg)}
.stat b{display:block;font-size:1.4rem;line-height:1.1}
.stat span{font-size:.85rem;color:var(--muted)}
.savebar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 16px;margin-bottom:20px}
.savebar .msg{color:var(--muted)}
.savebar.dirty{border-color:var(--brand)}
.savebar.dirty .msg{color:var(--ink);font-weight:600}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.tools input{width:260px;text-align:left}
.tablebox{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:980px;font-size:.92rem}
th{text-align:left;font-weight:600;color:var(--muted);font-size:.82rem;padding:10px 10px;border-bottom:1px solid var(--line);vertical-align:bottom;background:var(--surface)}
td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.first td{border-top:2px solid var(--line)}
td.num,th.num{text-align:right}
td.name{font-weight:600;max-width:220px}
td.name small{display:block;font-weight:400;color:var(--muted)}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:.8rem;font-weight:600;white-space:nowrap}
.p-ok{background:var(--slate-soft);color:var(--slate)}
.p-warn{background:var(--amber-soft);color:var(--amber)}
.p-bad{background:var(--brand-soft);color:var(--brand)}
.p-off{background:var(--grey-soft);color:var(--muted)}
.dim td{color:var(--muted)}
.hint{font-size:.85rem;color:var(--muted);margin-top:10px}
.changed{box-shadow:inset 3px 0 0 var(--brand)}

.brand{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;background:#fff;border-radius:10px;padding:16px 20px 14px;margin-bottom:22px;border:1px solid var(--line)}
.brand img{height:56px;width:auto;display:block}
.brand .area{font-family:"Tinos","Times New Roman",Times,serif;color:#6b8289;font-size:1.05rem;border-bottom:2px solid #1d2427;padding-bottom:2px}
@media (max-width:520px){.brand img{height:34px}}

  h+='<div class="grid"><section class="panel"><h2>Sconti per scadenza</h2><div class="bands">';
  bs.forEach(function(b,idx){var raw=S.bande[b.i];var lab=b.m===0?(idx>0?'Sotto i '+bs[idx-1].m+' mesi':'Qualsiasi scadenza'):(idx===0?'Scadenza ad almeno '+b.m+' mesi':'Da '+b.m+' a meno di '+bs[idx-1].m+' mesi');
    h+='<div class="band"><span class="sw" style="background:'+BAND_COLORS[idx%BAND_COLORS.length]+'"></span><label for="bm'+b.i+'">'+lab+'</label><span><input id="bm'+b.i+'" data-bm="'+b.i+'" inputmode="numeric" value="'+esc(raw.m)+'" aria-label="Mesi minimi"><span class="unit">mesi</span></span><span><input id="bs'+b.i+'" data-bs="'+b.i+'" inputmode="decimal" value="'+esc(raw.s)+'" aria-label="Sconto"><span class="unit">%</span></span><button class="x" data-del="'+b.i+'" aria-label="Elimina fascia" '+(S.bande.length<2?'disabled':'')+'>×</button></div>';});
  h+='</div><div class="row" style="margin-top:12px"><button id="addband">Aggiungi fascia</button><span class="row"><label for="iva">IVA predefinita</label><input id="iva" inputmode="decimal" value="'+esc(S.iva)+'"><span class="unit">%</span></span></div>';
  if(errs.length)h+='<div class="err">'+errs.map(esc).join('<br>')+'</div>';
  h+='<p class="hint">Lo sconto si applica al prezzo al pubblico IVA inclusa. Per un\'eccezione su un singolo lotto scrivi lo sconto nella tabella; lasciando vuota la cella torna quello della fascia.</p></section>';
  h+='<section class="panel"><h2>Come risultano oggi i lotti</h2><div class="stats">';
  bs.forEach(function(b,idx){h+='<div class="stat" style="box-shadow:inset 3px 0 0 '+BAND_COLORS[idx%BAND_COLORS.length]+'"><b>'+(counts[b.i]||0)+'</b><span>lotti al '+esc(S.bande[b.i].s)+'%</span></div>';});
  if(counts.ov)h+='<div class="stat"><b>'+counts.ov+'</b><span>lotti con sconto personalizzato</span></div>';
  h+='<div class="stat"><b>'+stat.miss+'</b><span>lotti mancanti per difformità</span></div><div class="stat"><b>'+stat.nop+'</b><span>lotti senza prezzo</span></div><div class="stat"><b>'+stat.off+'</b><span>lotti senza scadenza o scaduti</span></div></div><p class="hint">Giacenza del 21/09/2026. Fasce calcolate alla data di oggi, '+today.toLocaleDateString('it-IT')+'.</p></section></div>';
  h+='<div class="tools"><input id="q" type="search" placeholder="Cerca prodotto, codice o lotto" value="'+esc(filter)+'" aria-label="Cerca"></div>';
  h+='<div class="tablebox"><table><thead><tr><th>Prodotto</th><th>Lotto</th><th>Scadenza</th><th class="num">Pezzi</th><th class="num">Prezzo al pubblico IVA incl.</th><th class="num">IVA %</th><th class="num">Pubblico IVA escl.</th><th class="num">Sconto %</th><th class="num">Farmacia IVA incl.</th><th class="num">Farmacia IVA escl.</th><th>Stato</th></tr></thead><tbody>';
  var f=filter.trim().toLowerCase(), shown=0;
  P.forEach(function(p){
    if(f&&(p.n+' '+p.c+' '+p.l.map(function(l){return l.k;}).join(' ')).toLowerCase().indexOf(f)<0)return;
    p.l.forEach(function(l,li){shown++;
      var c=ok?calc(S,p,l):calc(saved,p,l), b=ok?calc(saved,p,l):c, ch=dd&&ok&&(c.far!==b.far||c.stato!==b.stato||c.iva!==b.iva);
      var price=S.prezzi[p.c]!=null?S.prezzi[p.c]:(p.p==null?'':p.p);
      h+='<tr class="'+(li===0?'first ':'')+(c.stato!=='Disponibile'?'dim ':'')+(ch?'changed':'')+'">';
      if(li===0)h+='<td class="name" rowspan="'+p.l.length+'">'+esc(p.n)+'<small>'+p.c+'</small></td>';
      h+='<td>'+esc(l.k)+'</td><td>'+fmtD(l.s)+'</td><td class="num">'+l.q.toLocaleString('it-IT')+'</td>';
      if(li===0){h+='<td class="num" rowspan="'+p.l.length+'"><input id="pr'+p.c+'" data-pr="'+p.c+'" inputmode="decimal" value="'+esc(price)+'" class="'+(S.prezzi[p.c]!=null?'over':'')+'" aria-label="Prezzo al pubblico"></td><td class="num" rowspan="'+p.l.length+'"><input id="iv'+p.c+'" data-iv="'+p.c+'" inputmode="decimal" placeholder="'+esc(S.iva)+'" value="'+esc(S.ivaProd[p.c]!=null?S.ivaProd[p.c]:'')+'" class="'+(S.ivaProd[p.c]!=null?'over':'')+'" style="width:56px" aria-label="IVA del prodotto"></td>';}
      var k=lotKey(p,l), ov=S.scontoLotto[k];
      h+='<td class="num">'+(c.pubN!=null?eur(c.pubN):'')+'</td>';
      h+='<td class="num">'+(c.stato==='Disponibile'||ov!=null?'<span style="display:inline-flex;align-items:center;gap:6px"><span class="sw" style="background:'+(ov!=null?'var(--ink)':bandIndexColor(S,c.band))+';width:8px;height:8px;border-radius:50%"></span><input id="sl'+esc(k)+'" data-sl="'+esc(k)+'" inputmode="decimal" placeholder="'+(c.band?esc(S.bande[c.band.i].s):'')+'" value="'+(ov!=null?esc(ov):'')+'" class="'+(ov!=null?'over':'')+'" style="width:56px" aria-label="Sconto del lotto"></span>':'')+'</td>';
      h+='<td class="num">'+(c.far!=null?eur(c.far):'')+'</td><td class="num"><b>'+(c.farN!=null?eur(c.farN):'')+'</b></td>';
      h+='<td><span class="pill '+c.cls+'"'+(c.note?' title="'+esc(c.note)+'"':'')+'>'+c.stato+'</span></td></tr>';});});
  if(!shown)h+='<tr><td colspan="11">Nessun prodotto corrisponde alla ricerca. Prova con il nome, il codice minsan o il lotto.</td></tr>';
  h+='</tbody></table></div><p class="hint">Le celle evidenziate sono valori modificati a mano. Un prodotto i cui lotti non tornano con il totale del deposito resta mancante temporaneamente finché i dati non vengono corretti.</p>';
  app.querySelector('.body').innerHTML=h;
  if(focusId){var el=document.getElementById(focusId);if(el){el.focus();if(selS!=null){try{el.setSelectionRange(selS,selS);}catch(e){}}}}
}
function num(v){v=String(v).replace(',','.').trim();return v===''?'':(isNaN(+v)?v:+v);}
app.addEventListener('input',function(e){var t=e.target,d=t.dataset;
  if(t.id==='q'){filter=t.value;render();return;}
  if(t.id==='iva'){S.iva=num(t.value);}
  else if(d.bm!=null){S.bande[+d.bm].m=num(t.value);}
  else if(d.bs!=null){S.bande[+d.bs].s=num(t.value);}
  else if(d.pr!=null){var v=num(t.value),o=DATA.prodotti.filter(function(p){return p.c===d.pr;})[0].p;if(v===''||v===o)delete S.prezzi[d.pr];else if(typeof v==='number')S.prezzi[d.pr]=v;}
  else if(d.iv!=null){var v2=num(t.value);if(v2===''||typeof v2!=='number')delete S.ivaProd[d.iv];else S.ivaProd[d.iv]=v2;}
  else if(d.sl!=null){var v3=num(t.value);if(v3===''||typeof v3!=='number'||v3<0||v3>100)delete S.scontoLotto[d.sl];else S.scontoLotto[d.sl]=v3;}
  else return; render();});
app.addEventListener('click',function(e){var t=e.target;
  if(t.id==='addband'){var ms=S.bande.map(function(b){return +b.m||0;});S.bande.push({m:Math.max.apply(null,ms)+3,s:30});render();}
  else if(t.dataset.del!=null){S.bande.splice(+t.dataset.del,1);render();}
  else if(t.id==='undo'){S=JSON.parse(JSON.stringify(saved));render();}
  else if(t.id==='save'){save();}});
function doc(state){
  var d={prodotti:DATA.prodotti,impostazioni:state};
  var json=JSON.stringify(d).replace(/</g,'\\u003c');
  var css=document.getElementById('css').textContent, js=document.getElementById('app-js').textContent, sc='script';
  return '<!DOCTYPE html>\n<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Sconti e prezzi farmacia – Sagè Pharma</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&family=Tinos&display=swap" rel="stylesheet"><style id="css">'+css+'</style></head><body><div id="app"><div class="wrap">'+document.getElementById('brand').outerHTML+'<h1>Sconti e prezzi farmacia</h1><p class="sub">Modifica le fasce di sconto, l\'IVA e le eccezioni: i prezzi farmacia di ogni lotto si aggiornano subito. Con “Salva modifiche” le nuove impostazioni restano per tutti quelli che aprono questa pagina.</p><div class="body"></div></div></div><'+sc+' type="application/json" id="stato">'+json+'</'+sc+'><'+sc+' id="app-js">'+js+'</'+sc+'></body></html>';}
async function save(){
  if(!capArtifact){readOnly=true;render();return;}
  saving=true;render();
  var st=JSON.parse(JSON.stringify(S));st.salvato=new Date().toLocaleString('it-IT',{dateStyle:'short',timeStyle:'short'});
  try{await capArtifact.publish(doc(st));}
  catch(err){saving=false;var c=err&&err.code;
    if(c==='conflict'){return;}
    if(c==='not_writer'||c==='not_granted'){readOnly=true;}
    else alert(c==='rate_limited'?'Troppi salvataggi ravvicinati: riprova tra qualche istante.':'Salvataggio non riuscito ('+(c||'errore')+'). Le modifiche sono ancora qui: riprova.');
    render();}}
render();
if(window.claude&&window.claude.use){window.claude.use('artifact').then(function(a){capArtifact=a;if(!a){readOnly=true;}render();}).catch(function(){readOnly=true;render();});}
else{readOnly=true;render();}
})();
</script></body></html>
